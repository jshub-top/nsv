


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["1739616529"]

[workspace]
resolver = "2"
members = ["crates/root", "crates/nsv", "crates/serve"]

[profile.release]
opt-level = 'z'   # Optimize for size
lto = true
codegen-units = 1

[workspace.dependencies]
root = { path = "crates/root" }
tokio = { version = "1.34.0", features = ["fs", "macros", "net", "rt", "rt-multi-thread"]}
serde = { version = "1.0.193", features = ["derive"] }
reqwest = { version = "0.12.15", features = ["stream", "json"] }
async-trait = "0.1.74"
futures = "0.3.31"
regex = "1.1.4"
sevenz-rust = "0.6.1"
tar = "0.4.40"
xz2 = { version = "0.1.7", features = ["tokio"] }
anyhow = "1.0.98"
thiserror = "2.0.12"
serde_json = "1.0.140"
futures-util = "0.3.31"
semver = "1.0.26"
rust-ini = "0.21.1"